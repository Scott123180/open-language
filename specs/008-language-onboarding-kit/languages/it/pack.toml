# Language pack for Italian (it), written by `kit.sh scaffold`. Fill every TODO and empty
# list, then run `kit.sh validate it` until it reports no errors. Comments are guidance
# and are ignored; never edit the generated data files by hand.

# ── code ────────────────────────────────────────────────────────────── derived · needed by 006
# The language's ISO 639-1 code; also the data files' names.
# Rules: required; ISO 639-1, two lowercase letters; not already a practice language; not the explanation language; written left to right with spaces between words; supported by the speech recogniser.
# Example (German): "de"
code = "it"

# ── name ──────────────────────────────────────────────────────────────── agent · needed by 006
# The language's English name, as prompts and the Settings screen show it.
# Rules: required; unique across languages.
# Example (German): "German"
name = "Italian"

# ── default_voice ────────────────────────────────────────────────────── chosen · needed by 006
# The voice a learner hears until they choose another.
# Rules: required; one of the language's voices.
# Example (German): "de_DE-thorsten-medium"
default_voice = "it_IT-paola-medium"

# ── voices ───────────────────────────────────────────────────────────── chosen · needed by 006
# The Piper voices that speak the language. Choose keys from the candidates listed below.
# Rules: required; at least 1 item; each key unique across languages; single-speaker voices of the language, from the Piper catalogue; two or more voices; voices of both genders.
# Example (German): key = "de_DE-thorsten-medium", display_name = "Thorsten (Germany)", gender = "male", locale = "de_DE", qualit…
# Candidate voices (key, locale, country, quality, download size):
#   it_IT-paola-medium           it_IT  Italy        medium  64 MB
#   it_IT-riccardo-x_low         it_IT  Italy        x_low   28 MB
#   it_IT-serena-high            it_IT  Italy        high    114 MB
#   it_IT-serena-medium          it_IT  Italy        medium  64 MB

# ── voices[].gender ───────────────────────────────────────────────────── agent · needed by 007
# Each voice's gender, from its name or model card; podcasts cast hosts by it.
# Rules: required; one of "female", "male".
# Example (German): "male"

# ── voices[].speaking_rate ────────────────────────────────────────────── agent · needed by 006
# How fast the voice speaks; leave it out for natural.
# Rules: required; one of "natural", "fast", "slow".
# Example (German): "natural"
# A voice may also set display_name = "<Name> (<Place>)" to override the name the kit derives
# from the catalogue (the voice's name and country).
# Add one [[voices]] table per chosen voice, for example:
# [[voices]]
# key = "it_IT-paola-medium"
# gender = "female"
[[voices]]
key = "it_IT-paola-medium"
gender = "female"

[[voices]]
key = "it_IT-riccardo-x_low"
gender = "male"

